<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" fill="none" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#39ff14"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="900" height="230" fill="url(#bg)"/>
  <rect width="900" height="230" fill="url(#grid)"/>

  <!-- terminal window -->
  <rect x="34" y="30" width="832" height="170" rx="10" fill="#0a0e14" stroke="#1f2937" stroke-width="1"/>
  <rect x="34" y="30" width="832" height="30" rx="10" fill="#161b22"/>
  <rect x="34" y="52" width="832" height="8" fill="#161b22"/>
  <circle cx="54" cy="45" r="5" fill="#ff5f56"/>
  <circle cx="72" cy="45" r="5" fill="#ffbd2e"/>
  <circle cx="90" cy="45" r="5" fill="#27c93f"/>
  <text x="430" y="49" font-size="11" fill="#8b949e" text-anchor="middle">ricardo@decepticon: ~/whoami</text>

  <!-- prompt line -->
  <text x="56" y="98" font-size="15" fill="#39ff14">➜</text>
  <text x="76" y="98" font-size="15" fill="#00f0ff">ricardo@decepticon</text>
  <text x="246" y="98" font-size="15" fill="#8b949e">:~$</text>
  <text x="282" y="98" font-size="15" fill="#c9d1d9">whoami --roles</text>

  <!-- big name -->
  <text x="56" y="150" font-size="36" font-weight="700" fill="url(#accent)">RICARDO LOPEZ</text>
  <rect x="430" y="126" width="13" height="28" fill="#39ff14">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.5;0.98;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>

  <!-- roles -->
  <text x="56" y="180" font-size="13" fill="#8b949e">Software Engineer  ·  Offensive Pentester  ·  AI Agent Orchestrator</text>

  <!-- corner ticks -->
  <path d="M34 30 h14 M34 30 v14" stroke="#00f0ff" stroke-width="1.5"/>
  <path d="M866 30 h-14 M866 30 v14" stroke="#00f0ff" stroke-width="1.5"/>
  <path d="M34 200 h14 M34 200 v-14" stroke="#39ff14" stroke-width="1.5"/>
  <path d="M866 200 h-14 M866 200 v-14" stroke="#39ff14" stroke-width="1.5"/>
</svg>
