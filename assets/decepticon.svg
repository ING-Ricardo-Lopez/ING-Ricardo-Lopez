<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" fill="none" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <linearGradient id="dacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#39ff14"/>
    </linearGradient>
    <pattern id="dgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="900" height="340" fill="url(#dbg)"/>
  <rect width="900" height="340" fill="url(#dgrid)"/>

  <!-- title -->
  <text x="40" y="52" font-size="28" font-weight="700" fill="url(#dacc)">DECEPTICON</text>
  <rect x="318" y="32" width="11" height="22" fill="#39ff14">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.5;0.98;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>
  <text x="40" y="74" font-size="12" fill="#8b949e">autonomous pentesting  ·  11 operators  ·  LLM-driven kill-chain</text>

  <!-- terminal -->
  <rect x="40" y="92" width="820" height="170" rx="8" fill="#0a0e14" stroke="#1f2937"/>
  <rect x="40" y="92" width="820" height="24" rx="8" fill="#161b22"/>
  <rect x="40" y="110" width="820" height="6" fill="#161b22"/>
  <circle cx="56" cy="104" r="4" fill="#ff5f56"/>
  <circle cx="70" cy="104" r="4" fill="#ffbd2e"/>
  <circle cx="84" cy="104" r="4" fill="#27c93f"/>
  <text x="450" y="108" font-size="10" fill="#8b949e" text-anchor="middle">decepticon@langgraph: ~/engagement</text>

  <!-- stream lines (staggered cascade loop) -->
  <g font-size="12.5">
    <!-- prompt (always on) -->
    <text x="56" y="140" fill="#39ff14">$</text>
    <text x="68" y="140" fill="#c9d1d9">decepticon launch --target [REDACTED] --mode deep</text>

    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.04;0.12;0.92;1" dur="7s" repeatCount="indefinite"/>
      <text x="56" y="162" fill="#00f0ff">[recon]</text>
      <text x="110" y="162" fill="#8b949e">attack surface mapped · 42 services exposed</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.16;0.24;0.92;1" dur="7s" repeatCount="indefinite"/>
      <text x="56" y="182" fill="#00f0ff">[osint]</text>
      <text x="110" y="182" fill="#8b949e">14 identities profiled · 3 breach credentials</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.36;0.92;1" dur="7s" repeatCount="indefinite"/>
      <text x="56" y="202" fill="#39ff14">[exploit]</text>
      <text x="110" y="202" fill="#8b949e">chain inferred · IDOR → authenticated PII access</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.40;0.48;0.92;1" dur="7s" repeatCount="indefinite"/>
      <text x="56" y="222" fill="#39ff14">[post]</text>
      <text x="110" y="222" fill="#8b949e">lateral movement · 2 hosts · persistence set</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.60;0.92;1" dur="7s" repeatCount="indefinite"/>
      <text x="56" y="242" fill="#00f0ff">[report]</text>
      <text x="110" y="242" fill="#8b949e">SARIF + executive PDF + technical DOCX generated</text>
      <text x="430" y="242" fill="#39ff14" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.64;0.92;1" dur="7s" repeatCount="indefinite"/>✓</text>
    </g>
  </g>

  <!-- kill-chain bar -->
  <g font-size="10" fill="#8b949e">
    <text x="450" y="296" text-anchor="middle" letter-spacing="2">RECON  ›  EXPLOIT  ›  POST-EXPLOIT  ›  LOOT  ›  REPORT</text>
    <circle cx="332" cy="316" r="3.5" fill="#00f0ff"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" repeatCount="indefinite" begin="0s"/></circle>
    <circle cx="402" cy="316" r="3.5" fill="#39ff14"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" repeatCount="indefinite" begin="0.35s"/></circle>
    <circle cx="498" cy="316" r="3.5" fill="#39ff14"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" repeatCount="indefinite" begin="0.7s"/></circle>
    <circle cx="566" cy="316" r="3.5" fill="#39ff14"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" repeatCount="indefinite" begin="1.05s"/></circle>
    <circle cx="636" cy="316" r="3.5" fill="#00f0ff"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" repeatCount="indefinite" begin="1.4s"/></circle>
  </g>

  <!-- corner ticks -->
  <path d="M40 92 h12 M40 92 v12" stroke="#00f0ff" stroke-width="1.5"/>
  <path d="M860 92 h-12 M860 92 v12" stroke="#00f0ff" stroke-width="1.5"/>
  <path d="M40 262 h12 M40 262 v-12" stroke="#39ff14" stroke-width="1.5"/>
  <path d="M860 262 h-12 M860 262 v-12" stroke="#39ff14" stroke-width="1.5"/>
</svg>
