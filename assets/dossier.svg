<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" fill="none" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="900" height="470" fill="#0a0a0a"/>
  <!-- marca de agua -->
  <text x="450" y="290" font-size="82" font-weight="800" fill="#141414" text-anchor="middle" transform="rotate(-26 450 290)" letter-spacing="8">MÁXIMO SECRETO</text>

  <!-- marco doble -->
  <rect x="16" y="16" width="868" height="438" fill="none" stroke="#3a3a3a" stroke-width="2"/>
  <rect x="26" y="26" width="848" height="418" fill="none" stroke="#262626" stroke-width="1"/>
  <circle cx="34" cy="34" r="4.5" fill="#1a1a1a" stroke="#4a4a4a"/>
  <circle cx="866" cy="34" r="4.5" fill="#1a1a1a" stroke="#4a4a4a"/>
  <circle cx="34" cy="436" r="4.5" fill="#1a1a1a" stroke="#4a4a4a"/>
  <circle cx="866" cy="436" r="4.5" fill="#1a1a1a" stroke="#4a4a4a"/>

  <!-- cabecera -->
  <line x1="40" y1="64" x2="150" y2="64" stroke="#3a3a3a"/>
  <line x1="750" y1="64" x2="860" y2="64" stroke="#3a3a3a"/>
  <text x="450" y="52" font-size="11" fill="#7a7a7a" text-anchor="middle" letter-spacing="5">DEPARTAMENTO DE OPERACIONES OFENSIVAS</text>
  <text x="450" y="80" font-size="9" fill="#d4a017" text-anchor="middle" letter-spacing="3">COMANDO CIBER CONJUNTO  //  CLASIFICADO</text>

  <!-- título -->
  <text x="450" y="140" font-size="42" font-weight="800" fill="#e8e6e1" text-anchor="middle" letter-spacing="10">EXPEDIENTE</text>
  <line x1="360" y1="156" x2="540" y2="156" stroke="#4a4a4a"/>

  <!-- referencias -->
  <text x="40" y="186" font-size="11" fill="#7a7a7a" letter-spacing="2">EXPEDIENTE №  MX-SIN-0451</text>
  <text x="860" y="186" font-size="11" fill="#7a7a7a" text-anchor="end" letter-spacing="2">REF  NV / 2026</text>

  <!-- campos -->
  <g font-size="12">
    <text x="60" y="228" fill="#7a7a7a" letter-spacing="2">SUJETO</text>
    <text x="340" y="228" fill="#e8e6e1">LÓPEZ ESPINOZA, RICARDO ALONSO</text>

    <text x="60" y="256" fill="#7a7a7a" letter-spacing="2">ALIAS</text>
    <text x="340" y="256" fill="#e8e6e1">NUEVOVIRUZ</text>

    <text x="60" y="284" fill="#7a7a7a" letter-spacing="2">UBICACIÓN</text>
    <text x="340" y="284" fill="#e8e6e1">MAZATLÁN, SINALOA · MX</text>

    <text x="60" y="312" fill="#7a7a7a" letter-spacing="2">DISCIPLINA</text>
    <text x="340" y="312" fill="#e8e6e1">SOFTWARE · SEGURIDAD OFENSIVA · IA</text>

    <text x="60" y="340" fill="#7a7a7a" letter-spacing="2">ACCESO</text>
    <text x="340" y="340" fill="#d4a017">NIVEL 5 — OPERADOR AUTORIZADO</text>

    <text x="60" y="368" fill="#7a7a7a" letter-spacing="2">ESTADO</text>
    <circle cx="346" cy="364" r="5" fill="#5a8a3a"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="358" y="368" fill="#e8e6e1">ACTIVO — 2 AÑOS INGENIERO + 6 FREELANCE</text>

    <text x="60" y="396" fill="#7a7a7a" letter-spacing="2">CONTACTO</text>
    <rect x="340" y="386" width="300" height="14" fill="#000"/>
    <text x="346" y="396" fill="#7a7a7a">█ ████ ████ // CENSURADO — VER CANALES ABAJO</text>
  </g>

  <!-- líneas guía -->
  <line x1="135" y1="224" x2="320" y2="224" stroke="#262626" stroke-dasharray="2 3"/>
  <line x1="120" y1="252" x2="320" y2="252" stroke="#262626" stroke-dasharray="2 3"/>
  <line x1="155" y1="280" x2="320" y2="280" stroke="#262626" stroke-dasharray="2 3"/>
  <line x1="160" y1="308" x2="320" y2="308" stroke="#262626" stroke-dasharray="2 3"/>
  <line x1="130" y1="336" x2="320" y2="336" stroke="#262626" stroke-dasharray="2 3"/>
  <line x1="120" y1="364" x2="320" y2="364" stroke="#262626" stroke-dasharray="2 3"/>
  <line x1="135" y1="392" x2="320" y2="392" stroke="#262626" stroke-dasharray="2 3"/>

  <!-- sello CLASIFICADO -->
  <g transform="rotate(-10 770 120)">
    <rect x="670" y="95" width="200" height="50" fill="none" stroke="#d62828" stroke-width="2.5"/>
    <rect x="675" y="100" width="190" height="40" fill="none" stroke="#d62828" stroke-width="1"/>
    <text x="770" y="128" font-size="22" font-weight="800" fill="#d62828" text-anchor="middle" letter-spacing="3">CLASIFICADO</text>
    <animate attributeName="opacity" values="1;0.55;1" dur="2.6s" repeatCount="indefinite"/>
  </g>

  <!-- sello AUTORIZADO -->
  <g transform="rotate(7 150 430)">
    <rect x="70" y="408" width="160" height="44" fill="none" stroke="#5a8a3a" stroke-width="2"/>
    <text x="150" y="436" font-size="18" font-weight="800" fill="#5a8a3a" text-anchor="middle" letter-spacing="3">AUTORIZADO</text>
  </g>
</svg>
