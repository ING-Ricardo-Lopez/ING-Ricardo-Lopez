<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" fill="none" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace">
  <defs>
    <linearGradient id="obg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.6" stop-color="#00b8d4"/>
      <stop offset="1" stop-color="#005f66"/>
    </radialGradient>
    <pattern id="ogrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="900" height="440" fill="url(#obg)"/>
  <rect width="900" height="440" fill="url(#ogrid)"/>

  <text x="450" y="34" font-size="16" fill="#c9d1d9" text-anchor="middle" letter-spacing="3">MULTI-AGENT SWARM · 11 OPERATORS</text>

  <!-- connections (core -> each operator) with flowing signal -->
  <g stroke="#1f3a40" stroke-width="1.4" stroke-dasharray="3 7">
    <line x1="450" y1="210" x2="450" y2="105"><animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite"/></line>
    <line x1="450" y1="210" x2="529" y2="125"><animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite" begin="-0.1s"/></line>
    <line x1="450" y1="210" x2="578" y2="188"><animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite" begin="-0.2s"/></line>
    <line x1="450" y1="210" x2="578" y2="252"><animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite" begin="-0.3s"/></line>
    <line x1="450" y1="210" x2="529" y2="315"><animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite" begin="-0.4s"/></line>
    <line x1="450" y1="210" x2="450" y2="340"><animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite" begin="-0.5s"/></line>
    <line x1="450" y1="210" x2="371" y2="315"><animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite" begin="-0.6s"/></line>
    <line x1="450" y1="210" x2="322" y2="252"><animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite" begin="-0.7s"/></line>
    <line x1="450" y1="210" x2="322" y2="188"><animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite" begin="-0.8s"/></line>
    <line x1="450" y1="210" x2="371" y2="125"><animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite" begin="-0.9s"/></line>
  </g>

  <!-- CORE: decepticon orchestrator -->
  <g>
    <circle cx="450" cy="210" r="42" fill="#00f0ff" opacity="0.12">
      <animate attributeName="r" values="42;54;42" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.18;0.04;0.18" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="210" r="30" fill="url(#core)" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="450" y="207" font-size="8" fill="#05080d" text-anchor="middle" font-weight="700">CORE</text>
    <text x="450" y="219" font-size="7" fill="#05080d" text-anchor="middle" font-weight="700">orchestrator</text>
  </g>

  <!-- OPERATORS -->
  <!-- helper: each = ping + node + label -->
  <!-- 1 ad_operator (top) -->
  <g>
    <circle cx="450" cy="105" r="18" fill="#39ff14" opacity="0.25"><animate attributeName="r" values="18;30;18" dur="2.4s" repeatCount="indefinite" begin="0s"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite" begin="0s"/></circle>
    <circle cx="450" cy="105" r="16" fill="#39ff14" stroke="#05080d" stroke-width="1"/>
    <text x="450" y="108" font-size="8" fill="#05080d" text-anchor="middle" font-weight="700">AD</text>
    <text x="450" y="88" font-size="9" fill="#c9d1d9" text-anchor="middle">ad_operator</text>
  </g>
  <!-- 2 osint (cyan) -->
  <g>
    <circle cx="529" cy="125" r="18" fill="#00f0ff" opacity="0.25"><animate attributeName="r" values="18;30;18" dur="2.4s" repeatCount="indefinite" begin="0.2s"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite" begin="0.2s"/></circle>
    <circle cx="529" cy="125" r="16" fill="#00f0ff" stroke="#05080d" stroke-width="1"/>
    <text x="529" y="128" font-size="8" fill="#05080d" text-anchor="middle" font-weight="700">OSINT</text>
    <text x="600" y="120" font-size="9" fill="#c9d1d9">osint_operator</text>
  </g>
  <!-- 3 iot -->
  <g>
    <circle cx="578" cy="188" r="18" fill="#39ff14" opacity="0.25"><animate attributeName="r" values="18;30;18" dur="2.4s" repeatCount="indefinite" begin="0.4s"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite" begin="0.4s"/></circle>
    <circle cx="578" cy="188" r="16" fill="#39ff14" stroke="#05080d" stroke-width="1"/>
    <text x="578" y="191" font-size="8" fill="#05080d" text-anchor="middle" font-weight="700">IoT</text>
    <text x="648" y="191" font-size="9" fill="#c9d1d9">iot_operator</text>
  </g>
  <!-- 4 ics -->
  <g>
    <circle cx="578" cy="252" r="18" fill="#39ff14" opacity="0.25"><animate attributeName="r" values="18;30;18" dur="2.4s" repeatCount="indefinite" begin="0.6s"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite" begin="0.6s"/></circle>
    <circle cx="578" cy="252" r="16" fill="#39ff14" stroke="#05080d" stroke-width="1"/>
    <text x="578" y="255" font-size="8" fill="#05080d" text-anchor="middle" font-weight="700">ICS</text>
    <text x="648" y="255" font-size="9" fill="#c9d1d9">ics_operator</text>
  </g>
  <!-- 5 wireless -->
  <g>
    <circle cx="529" cy="315" r="18" fill="#39ff14" opacity="0.25"><animate attributeName="r" values="18;30;18" dur="2.4s" repeatCount="indefinite" begin="0.8s"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="529" cy="315" r="16" fill="#39ff14" stroke="#05080d" stroke-width="1"/>
    <text x="529" y="318" font-size="8" fill="#05080d" text-anchor="middle" font-weight="700">WIFI</text>
    <text x="600" y="335" font-size="9" fill="#c9d1d9">wireless_op</text>
  </g>
  <!-- 6 mobile (bottom) -->
  <g>
    <circle cx="450" cy="340" r="18" fill="#39ff14" opacity="0.25"><animate attributeName="r" values="18;30;18" dur="2.4s" repeatCount="indefinite" begin="1.0s"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite" begin="1.0s"/></circle>
    <circle cx="450" cy="340" r="16" fill="#39ff14" stroke="#05080d" stroke-width="1"/>
    <text x="450" y="343" font-size="8" fill="#05080d" text-anchor="middle" font-weight="700">MOB</text>
    <text x="450" y="372" font-size="9" fill="#c9d1d9" text-anchor="middle">mobile_operator</text>
  </g>
  <!-- 7 supply_chain -->
  <g>
    <circle cx="371" cy="315" r="18" fill="#39ff14" opacity="0.25"><animate attributeName="r" values="18;30;18" dur="2.4s" repeatCount="indefinite" begin="1.2s"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite" begin="1.2s"/></circle>
    <circle cx="371" cy="315" r="16" fill="#39ff14" stroke="#05080d" stroke-width="1"/>
    <text x="371" y="318" font-size="8" fill="#05080d" text-anchor="middle" font-weight="700">SPLY</text>
    <text x="300" y="335" font-size="9" fill="#c9d1d9" text-anchor="end">supply_chain</text>
  </g>
  <!-- 8 phisher -->
  <g>
    <circle cx="322" cy="252" r="18" fill="#39ff14" opacity="0.25"><animate attributeName="r" values="18;30;18" dur="2.4s" repeatCount="indefinite" begin="1.4s"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite" begin="1.4s"/></circle>
    <circle cx="322" cy="252" r="16" fill="#39ff14" stroke="#05080d" stroke-width="1"/>
    <text x="322" y="255" font-size="8" fill="#05080d" text-anchor="middle" font-weight="700">PHSH</text>
    <text x="252" y="255" font-size="9" fill="#c9d1d9" text-anchor="end">phisher</text>
  </g>
  <!-- 9 forensicator (cyan) -->
  <g>
    <circle cx="322" cy="188" r="18" fill="#00f0ff" opacity="0.25"><animate attributeName="r" values="18;30;18" dur="2.4s" repeatCount="indefinite" begin="1.6s"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite" begin="1.6s"/></circle>
    <circle cx="322" cy="188" r="16" fill="#00f0ff" stroke="#05080d" stroke-width="1"/>
    <text x="322" y="191" font-size="8" fill="#05080d" text-anchor="middle" font-weight="700">FORNS</text>
    <text x="252" y="191" font-size="9" fill="#c9d1d9" text-anchor="end">forensicator</text>
  </g>
  <!-- 10 blue_cell (red) -->
  <g>
    <circle cx="371" cy="125" r="18" fill="#ff5f56" opacity="0.25"><animate attributeName="r" values="18;30;18" dur="2.4s" repeatCount="indefinite" begin="1.8s"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite" begin="1.8s"/></circle>
    <circle cx="371" cy="125" r="16" fill="#ff5f56" stroke="#05080d" stroke-width="1"/>
    <text x="371" y="128" font-size="8" fill="#05080d" text-anchor="middle" font-weight="700">BLUE</text>
    <text x="300" y="120" font-size="9" fill="#c9d1d9" text-anchor="end">blue_cell</text>
  </g>

  <!-- legend -->
  <g font-size="10">
    <rect x="280" y="402" width="10" height="10" fill="#00f0ff"/><text x="296" y="411" fill="#8b949e">orchestrator · intel</text>
    <rect x="430" y="402" width="10" height="10" fill="#39ff14"/><text x="446" y="411" fill="#8b949e">offense</text>
    <rect x="530" y="402" width="10" height="10" fill="#ff5f56"/><text x="546" y="411" fill="#8b949e">defense</text>
  </g>
</svg>
