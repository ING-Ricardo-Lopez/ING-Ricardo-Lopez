<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" fill="none" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="900" height="380" fill="#0a0a0a"/>

  <!-- grid de coordenadas -->
  <g stroke="#161616" stroke-width="1">
    <line x1="90" y1="50" x2="90" y2="330"/><line x1="180" y1="50" x2="180" y2="330"/>
    <line x1="270" y1="50" x2="270" y2="330"/><line x1="360" y1="50" x2="360" y2="330"/>
    <line x1="450" y1="50" x2="450" y2="330"/><line x1="540" y1="50" x2="540" y2="330"/>
    <line x1="630" y1="50" x2="630" y2="330"/><line x1="720" y1="50" x2="720" y2="330"/>
    <line x1="810" y1="50" x2="810" y2="330"/>
    <line x1="40" y1="100" x2="860" y2="100"/><line x1="40" y1="145" x2="860" y2="145"/>
    <line x1="40" y1="190" x2="860" y2="190"/><line x1="40" y1="235" x2="860" y2="235"/>
    <line x1="40" y1="280" x2="860" y2="280"/>
  </g>
  <g font-size="8" fill="#3a3a3a" letter-spacing="1">
    <text x="90" y="355" text-anchor="middle">A</text><text x="180" y="355" text-anchor="middle">B</text>
    <text x="270" y="355" text-anchor="middle">C</text><text x="360" y="355" text-anchor="middle">D</text>
    <text x="450" y="355" text-anchor="middle">E</text><text x="540" y="355" text-anchor="middle">F</text>
    <text x="630" y="355" text-anchor="middle">G</text><text x="720" y="355" text-anchor="middle">H</text>
    <text x="810" y="355" text-anchor="middle">I</text>
    <text x="20" y="103">01</text><text x="20" y="148">02</text><text x="20" y="193">03</text>
    <text x="20" y="238">04</text><text x="20" y="283">05</text>
  </g>

  <text x="450" y="34" font-size="12" fill="#d4a017" text-anchor="middle" letter-spacing="4">MAPA TÁCTICO — OPERACIONES DE CAMPO</text>

  <!-- HQ + anillos de alcance -->
  <g stroke="#2e2e2e" fill="none">
    <circle cx="130" cy="190" r="90" stroke-dasharray="3 5"/>
    <circle cx="130" cy="190" r="180" stroke-dasharray="3 5"/>
    <circle cx="130" cy="190" r="270" stroke-dasharray="3 5"/>
  </g>
  <!-- barrido de radar -->
  <line x1="130" y1="190" x2="850" y2="190" stroke="#d62828" stroke-width="1.5" opacity="0.45">
    <animateTransform attributeName="transform" type="rotate" from="0 130 190" to="360 130 190" dur="7s" repeatCount="indefinite"/>
  </line>
  <!-- HQ -->
  <rect x="120" y="180" width="20" height="20" fill="none" stroke="#e8e6e1" stroke-width="1.5"/>
  <line x1="130" y1="175" x2="130" y2="205" stroke="#e8e6e1"/>
  <line x1="115" y1="190" x2="145" y2="190" stroke="#e8e6e1"/>
  <text x="130" y="223" font-size="8" fill="#e8e6e1" text-anchor="middle" letter-spacing="2">HQ</text>

  <!-- conexiones HQ → blancos -->
  <g stroke="#2a2a2a" stroke-width="1" stroke-dasharray="2 6">
    <line x1="130" y1="190" x2="280" y2="110"><animate attributeName="stroke-dashoffset" values="0;-8" dur="0.9s" repeatCount="indefinite"/></line>
    <line x1="130" y1="190" x2="450" y2="110"><animate attributeName="stroke-dashoffset" values="0;-8" dur="0.9s" repeatCount="indefinite" begin="-0.1s"/></line>
    <line x1="130" y1="190" x2="620" y2="110"><animate attributeName="stroke-dashoffset" values="0;-8" dur="0.9s" repeatCount="indefinite" begin="-0.2s"/></line>
    <line x1="130" y1="190" x2="780" y2="110"><animate attributeName="stroke-dashoffset" values="0;-8" dur="0.9s" repeatCount="indefinite" begin="-0.3s"/></line>
    <line x1="130" y1="190" x2="280" y2="285"><animate attributeName="stroke-dashoffset" values="0;-8" dur="0.9s" repeatCount="indefinite" begin="-0.4s"/></line>
    <line x1="130" y1="190" x2="450" y2="285"><animate attributeName="stroke-dashoffset" values="0;-8" dur="0.9s" repeatCount="indefinite" begin="-0.5s"/></line>
    <line x1="130" y1="190" x2="620" y2="285"><animate attributeName="stroke-dashoffset" values="0;-8" dur="0.9s" repeatCount="indefinite" begin="-0.6s"/></line>
    <line x1="130" y1="190" x2="780" y2="285"><animate attributeName="stroke-dashoffset" values="0;-8" dur="0.9s" repeatCount="indefinite" begin="-0.7s"/></line>
  </g>

  <!-- blancos (fila superior) -->
  <g font-size="9">
    <!-- Puropollo CRÍTICO -->
    <circle cx="280" cy="110" r="13" fill="#d62828" opacity="0.18"><animate attributeName="r" values="13;22;13" dur="2.2s" repeatCount="indefinite" begin="0s"/><animate attributeName="opacity" values="0.35;0;0.35" dur="2.2s" repeatCount="indefinite" begin="0s"/></circle>
    <circle cx="280" cy="110" r="4" fill="#d62828"/>
    <text x="280" y="135" fill="#e8e6e1" text-anchor="middle" font-weight="700">Puropollo</text>

    <!-- SIGROMEX CRÍTICO -->
    <circle cx="450" cy="110" r="13" fill="#d62828" opacity="0.18"><animate attributeName="r" values="13;22;13" dur="2.2s" repeatCount="indefinite" begin="0.25s"/><animate attributeName="opacity" values="0.35;0;0.35" dur="2.2s" repeatCount="indefinite" begin="0.25s"/></circle>
    <circle cx="450" cy="110" r="4" fill="#d62828"/>
    <text x="450" y="135" fill="#e8e6e1" text-anchor="middle" font-weight="700">SIGROMEX</text>

    <!-- Tarjeta Amiga ALTO -->
    <circle cx="620" cy="110" r="13" fill="#d4a017" opacity="0.18"><animate attributeName="r" values="13;22;13" dur="2.2s" repeatCount="indefinite" begin="0.5s"/><animate attributeName="opacity" values="0.35;0;0.35" dur="2.2s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="620" cy="110" r="4" fill="#d4a017"/>
    <text x="620" y="135" fill="#e8e6e1" text-anchor="middle" font-weight="700">Tarjeta Amiga</text>

    <!-- Tecnocom CRÍTICO -->
    <circle cx="780" cy="110" r="13" fill="#d62828" opacity="0.18"><animate attributeName="r" values="13;22;13" dur="2.2s" repeatCount="indefinite" begin="0.75s"/><animate attributeName="opacity" values="0.35;0;0.35" dur="2.2s" repeatCount="indefinite" begin="0.75s"/></circle>
    <circle cx="780" cy="110" r="4" fill="#d62828"/>
    <text x="780" y="135" fill="#e8e6e1" text-anchor="middle" font-weight="700">Tecnocom</text>

    <!-- Revista Espejo INV -->
    <circle cx="280" cy="285" r="13" fill="#5a7a9a" opacity="0.18"><animate attributeName="r" values="13;22;13" dur="2.2s" repeatCount="indefinite" begin="1.0s"/><animate attributeName="opacity" values="0.35;0;0.35" dur="2.2s" repeatCount="indefinite" begin="1.0s"/></circle>
    <circle cx="280" cy="285" r="4" fill="#5a7a9a"/>
    <text x="280" y="310" fill="#e8e6e1" text-anchor="middle" font-weight="700">Revista Espejo</text>

    <!-- Hello Sushi INV -->
    <circle cx="450" cy="285" r="13" fill="#5a7a9a" opacity="0.18"><animate attributeName="r" values="13;22;13" dur="2.2s" repeatCount="indefinite" begin="1.25s"/><animate attributeName="opacity" values="0.35;0;0.35" dur="2.2s" repeatCount="indefinite" begin="1.25s"/></circle>
    <circle cx="450" cy="285" r="4" fill="#5a7a9a"/>
    <text x="450" y="310" fill="#e8e6e1" text-anchor="middle" font-weight="700">Hello Sushi</text>

    <!-- CBTIS CRÍTICO -->
    <circle cx="620" cy="285" r="13" fill="#d62828" opacity="0.18"><animate attributeName="r" values="13;22;13" dur="2.2s" repeatCount="indefinite" begin="1.5s"/><animate attributeName="opacity" values="0.35;0;0.35" dur="2.2s" repeatCount="indefinite" begin="1.5s"/></circle>
    <circle cx="620" cy="285" r="4" fill="#d62828"/>
    <text x="620" y="310" fill="#e8e6e1" text-anchor="middle" font-weight="700">CBTIS / DGETI</text>

    <!-- briq ALTO -->
    <circle cx="780" cy="285" r="13" fill="#d4a017" opacity="0.18"><animate attributeName="r" values="13;22;13" dur="2.2s" repeatCount="indefinite" begin="1.75s"/><animate attributeName="opacity" values="0.35;0;0.35" dur="2.2s" repeatCount="indefinite" begin="1.75s"/></circle>
    <circle cx="780" cy="285" r="4" fill="#d4a017"/>
    <text x="780" y="310" fill="#e8e6e1" text-anchor="middle" font-weight="700">briq</text>
  </g>

  <!-- leyenda severidad -->
  <g font-size="8" fill="#7a7a7a">
    <circle cx="300" cy="345" r="3" fill="#d62828"/><text x="310" y="348">crítico</text>
    <circle cx="370" cy="345" r="3" fill="#d4a017"/><text x="380" y="348">alto</text>
    <circle cx="425" cy="345" r="3" fill="#5a7a9a"/><text x="435" y="348">investigación</text>
  </g>

  <!-- brújula -->
  <g stroke="#3a3a3a" fill="#7a7a7a" font-size="8">
    <line x1="845" y1="50" x2="845" y2="78"/>
    <text x="845" y="46" text-anchor="middle">N</text>
  </g>
</svg>
